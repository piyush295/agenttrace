[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agenttrace"
version = "0.1.0"
description = "Forensic reconstruction for AI agent security incidents (local-first, standards-aligned, defensive DFIR)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "AgentTrace contributors" }]
keywords = [
    "forensics", "dfir", "incident-response", "ai-agents", "llm",
    "opentelemetry", "mitre-atlas", "chain-of-custody", "security",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Information Technology",
    "Intended Audience :: Legal Industry",
    "Topic :: Security",
    "Topic :: System :: Monitoring",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
# Intentionally zero runtime dependencies (stdlib only) so it can run inside
# sensitive/air-gapped forensic environments.
dependencies = []

[project.optional-dependencies]
# Development tooling only — never required at runtime.
dev = [
    "build>=1.0",
]

[project.urls]
Homepage = "https://github.com/your-org/agenttrace"
Documentation = "https://github.com/your-org/agenttrace#readme"
Repository = "https://github.com/your-org/agenttrace"
Issues = "https://github.com/your-org/agenttrace/issues"
Changelog = "https://github.com/your-org/agenttrace/blob/main/CHANGELOG.md"

[project.scripts]
agenttrace = "agenttrace.cli:main"

[tool.setuptools.packages.find]
include = ["agenttrace*"]
exclude = ["tests*"]
